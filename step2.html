
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZimLoan - Educational Demo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.page {
    width: 100%;
}

#page3 {
    display: none;
}

.container {
    width: 100%;
    max-width: 460px;
    background: white;
    padding: 35px 25px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    font-size: 43px;
    font-weight: bold;
    margin-bottom: 65px;
    letter-spacing: -2px;
}

.logo .zim {
    color: #07852d;
}

.logo .loan {
    color: #e9aa00;
}

h2 {
    text-align: center;
    color: #173d85;
    font-size: 29px;
    margin-bottom: 55px;
}

.form-group {
    margin-bottom: 34px;
}

label {
    display: block;
    font-size: 17px;
    color: #33394b;
    margin-bottom: 12px;
}

input {
    width: 100%;
    height: 60px;
    padding: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 15px;
    font-size: 17px;
    outline: none;
    transition: 0.3s;
    background: #fff;
}

input:focus {
    border-color: #1760b0;
    box-shadow: 0 0 5px rgba(23,96,176,0.15);
}

input::placeholder {
    color: #a4a4a4;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 5px 0 55px;
    font-size: 15px;
    color: #33394b;
}

.checkbox input {
    width: 21px;
    height: 21px;
    flex-shrink: 0;
    accent-color: #0754a3;
}

button {
    width: 100%;
    height: 72px;
    background: #0755a5;
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 15px rgba(0,70,150,0.2);
    transition: 0.3s;
}

button:hover {
    background: #064486;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

.notice {
    font-size: 12px;
    color: #777;
    margin-top: 20px;
    text-align: center;
    line-height: 1.6;
}

/* PAGE 3 */

#page3 {
    min-height: 100vh;
    background: #ffffff;
    justify-content: center;
    overflow-x: hidden;
}

.login-container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 25px 25px;
    overflow: hidden;
    background: linear-gradient(
        150deg,
        #ffffff 65%,
        #effff1 100%
    );
}

.top-design {
    position: absolute;
    top: -100px;
    left: -100px;
    width: 650px;
    height: 210px;
    border-radius: 50%;
    border-bottom: 20px solid #008b24;
    transform: rotate(-13deg);
    pointer-events: none;
}

.top-design::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-bottom: 14px solid #ffb900;
    border-radius: 50%;
    top: 14px;
}

.login-logo {
    margin-top: 175px;
    font-size: clamp(48px, 13vw, 76px);
    font-weight: 800;
    letter-spacing: -4px;
    white-space: nowrap;
}

.login-logo span:first-child {
    color: #00852a;
}

.login-logo span:last-child {
    color: #f5ae00;
}

.heading {
    margin-top: 125px;
    color: #123d91;
    font-size: 36px;
    font-weight: bold;
    text-align: center;
}

.pin-boxes {
    display: flex;
    gap: 9px;
    margin-top: 48px;
    justify-content: center;
    width: 100%;
}

.pin-box {
    width: 25%;
    max-width: 95px;
    height: 95px;
    border: 2px solid #d6d6d6;
    border-radius: 25px;
    background: white;
}

.login-btn {
    width: 100%;
    height: 80px;
    margin-top: 55px;
    border: none;
    border-radius: 27px;
    background: linear-gradient(
        100deg,
        #00a522,
        #00852a
    );
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:active {
    transform: scale(0.98);
}

.shield {
    margin-top: 65px;
    width: 230px;
    height: 230px;
    border: 15px solid #d5f5df;
    background: #c8f1d5;
    clip-path: polygon(
        50% 0%, 100% 25%, 90% 75%,
        50% 100%, 10% 75%, 0% 25%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 95px;
    opacity: 0.65;
}

@media (max-width: 400px) {
    .container {
        padding: 30px 20px;
    }

    .logo {
        font-size: 37px;
    }

    h2 {
        font-size: 25px;
    }
}

@media (max-width: 380px) {
    .login-logo {
        margin-top: 150px;
    }

    .heading {
        margin-top: 100px;
        font-size: 29px;
    }

    .pin-box {
        height: 75px;
    }

    .shield {
        width: 190px;
        height: 190px;
    }
}
</style>
</head>

<body>

<!-- PAGE 2 -->

<div class="page" id="page2">

<div class="container">

    <div class="logo">
        <span class="zim">Zim</span><span class="loan">Loan</span>
    </div>

    <form id="loanForm" novalidate>

        <h2>Loan Application</h2>

        <div class="form-group">
            <label>Demo Phone Number</label>
            <input type="text"
            placeholder="DEMO PHONE NUMBER"
            required>
        </div>

        <div class="form-group">
            <label>Demo Reference ID</label>
            <input type="text"
            placeholder="DEMO ID ONLY"
            required>
        </div>

        <div class="form-group">
            <label>Demo Loan Amount (USD)</label>
            <input type="number"
            placeholder="Enter demo amount"
            min="1"
            required>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="confirm" required>
            <label for="confirm">
                I confirm this is a demonstration.
            </label>
        </div>

        <button type="submit">
            SUBMIT APPLICATION
        </button>

    </form>

    <p class="notice">
        EDUCATIONAL MOCKUP ONLY.
        No personal information is collected, transmitted or saved.
    </p>

</div>
</div>

<!-- PAGE 3 -->

<div class="page" id="page3">

<div class="login-container">

    <div class="top-design"></div>

    <div class="login-logo">
        <span>Zim</span><span>Loan</span>
    </div>

    <h1 class="heading">
        Secured Login 🔒
    </h1>

    <div class="pin-boxes">
        <div class="pin-box"></div>
        <div class="pin-box"></div>
        <div class="pin-box"></div>
        <div class="pin-box"></div>
    </div>

    <button class="login-btn" onclick="showDemo()">
        Login
    </button>

    <div class="shield">
        🔒
    </div>

    <p class="notice">
        EDUCATIONAL DEMONSTRATION ONLY.
        No credentials are collected.
    </p>

</div>

<div style="position:fixed; bottom:0; left:0; width:100%; background:#0a7a42; color:white; padding:8px; font-size:14px; z-index:999;">
<marquee behavior="scroll" direction="left" scrollamount="5">
Trust with us. Your loyal partner always ® &nbsp;&nbsp; • &nbsp;&nbsp;
100% Trusted &nbsp;&nbsp; • &nbsp;&nbsp; 1000+ Happy Customers
</marquee>
</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("loanForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const inputs = form.querySelectorAll("input[required]");

        for (const input of inputs) {
            if (input.type === "checkbox" && !input.checked) {
                alert("Please confirm the educational demonstration.");
                return;
            }

            if (input.type !== "checkbox" && !input.value.trim()) {
                alert("Please complete the demonstration fields.");
                input.focus();
                return;
            }
        }

        document.getElementById("page2").style.display = "none";

        document.getElementById("page3").style.display = "block";

        document.body.style.padding = "0";
        document.body.style.alignItems = "flex-start";
        document.body.style.background = "#ffffff";

        window.scrollTo(0, 0);

    });

});

function showDemo() {
    alert("Educational demonstration only. No credentials collected or transmitted.");
}

</script>

</body>
</html>
