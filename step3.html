<!DOCTYPE html>
<html lang="en">

<title>ZimLoan - Secured Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 25px 25px;
    overflow: hidden;
    background: linear-gradient(
        150deg,
        #ffffff 65%,
        #effff1 100%
    );
}

/* Decorative top curves */
.top-design {
    position: absolute;
    top: -100px;
    left: -100px;
    width: 650px;
    height: 210px;
    border-radius: 50%;
    border-bottom: 20px solid #008b24;
    transform: rotate(-13deg);
    pointer-events: none;
}

.top-design::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-bottom: 14px solid #ffb900;
    border-radius: 50%;
    top: 14px;
}

/* Logo */
.logo {
    margin-top: 175px;
    font-size: clamp(48px, 13vw, 76px);
    font-weight: 800;
    letter-spacing: -4px;
    white-space: nowrap;
}

.logo span:first-child {
    color: #00852a;
}

.logo span:last-child {
    color: #f5ae00;
}

/* Heading */
.heading {
    margin-top: 125px;
    color: #123d91;
    font-size: 36px;
    font-weight: bold;
    text-align: center;
}

/* PIN visual boxes */
.pin-boxes {
    display: flex;
    gap: 9px;
    margin-top: 48px;
    justify-content: center;
    width: 100%;
}

.pin-box {
    width: 25%;
    max-width: 95px;
    height: 95px;
    border: 2px solid #d6d6d6;
    border-radius: 25px;
    background: white;
}

/* Login button */
.login-btn {
    width: 100%;
    height: 80px;
    margin-top: 55px;
    border: none;
    border-radius: 27px;
    background: linear-gradient(
        100deg,
        #00a522,
        #00852a
    );
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:active {
    transform: scale(0.98);
}

/* Shield */
.shield {
    margin-top: 65px;
    width: 230px;
    height: 230px;
    border: 15px solid #d5f5df;
    background: #c8f1d5;
    clip-path: polygon(
        50% 0%, 100% 25%, 90% 75%,
        50% 100%, 10% 75%, 0% 25%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 95px;
    opacity: 0.65;
}

.disclaimer strong {

@media (max-width: 380px) {
    .logo {
        margin-top: 150px;

    .pin-box {

        width: 190px;
        height: 190px;
    }
}
</style>
</head>
